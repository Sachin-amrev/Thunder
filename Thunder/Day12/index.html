<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2e0f38;
        }

        .container {
            background: rgb(152, 126, 126);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgb(237, 232, 232);
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .weak {
            color: red;
        }

        .medium {
            color: orange;
        }

        .strong {
            color: green;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Password Strength Checker</h2>

        <input type="password" id="password" placeholder="Enter Password">

        <div id="result"></div>
    </div>

    <script src="first.js"></script>

</body>
</html>
